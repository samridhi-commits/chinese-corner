<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8B1A1A">
<title>Chinese Corner · Taboo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&family=Lora:ital@1&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>/* TMS consumer track. See CLAUDE.md "Brand rules". */
:root {
  --crimson: #8B1A1A;
  --gold: #F8D346;
  --cream: #FDF7EF;
  --silk: #F8E8DD;
  --teal: #00515D;
  --slate: #6B6259;
  --ink: #2A2420;
  --line: #E9D9CC;
  --zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --ui: "Inter", system-ui, sans-serif;
  --head: "Montserrat", "Inter", sans-serif;
  --gloss: "Lora", Georgia, serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 16px/1.45 var(--ui);
  padding-bottom: env(safe-area-inset-bottom);
}

.top {
  background: var(--crimson);
  color: #fff;
  padding: calc(14px + env(safe-area-inset-top)) 20px 16px;
  position: relative;
  overflow: hidden;
}
.top::after {            /* low-opacity anchor character */
  content: "学";
  font-family: var(--zh);
  font-weight: 700;
  position: absolute;
  right: -6px;
  top: -18px;
  font-size: 120px;
  opacity: .09;
  line-height: 1;
}
.brand { font: 600 12px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
h1 { font: 700 26px/1.1 var(--head); margin: 6px auto 0; }
.top .brand, .top h1 { max-width: 488px; margin-left: auto; margin-right: auto; }   /* line up with main on wide screens */

main { max-width: 520px; margin: 0 auto; padding: 16px 16px 32px; }

.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.field-label { display: block; font: 600 14px/1.3 var(--ui); color: var(--slate); margin-bottom: 10px; }

.stepper { display: flex; align-items: center; gap: 14px; }
.stepper output { font: 700 28px/1 var(--head); min-width: 2ch; text-align: center; }
.stepper.small { margin-top: 10px; }
.stepper.small output { font-size: 20px; }
.step {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--crimson);
  background: #fff;
  color: var(--crimson);
  font: 600 22px/1 var(--ui);
  cursor: pointer;
}
.step:disabled { opacity: .3; cursor: default; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chip {
  min-height: 40px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: var(--cream);
  color: var(--ink);
  font: 600 15px/1 var(--ui);
  cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--crimson); border-color: var(--crimson); color: #fff; }
.chip .left { display: block; font: 400 11px/1.2 var(--ui); opacity: .8; margin-top: 2px; }
.levels .chip { padding: 6px 4px; font-size: 14px; border-radius: 12px; }

.toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 15px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--crimson); }

.player-row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.player-row input {
  font: 500 15px/1.2 var(--ui);
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--cream);
  width: 100%;
}

.msg { min-height: 1.4em; color: var(--crimson); font-size: 14px; margin: 4px 2px 10px; }
.msg.ok { color: var(--slate); }

button.primary, button.secondary {
  display: block;
  width: 100%;
  min-height: 52px;
  border-radius: 12px;
  font: 600 17px/1 var(--ui);
  cursor: pointer;
  margin-bottom: 10px;
}
button.primary { background: var(--crimson); color: #fff; border: 0; }
button.primary:disabled { opacity: .45; cursor: default; }
button.secondary { background: transparent; color: var(--crimson); border: 1.5px solid var(--crimson); }
button.link { background: none; border: 0; color: var(--crimson); font: 600 14px var(--ui); text-decoration: underline; cursor: pointer; padding: 6px; }

.hint { color: var(--slate); font-size: 14px; margin: 0 2px 12px; }

.hand {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid var(--line);
  border-left: 5px solid var(--crimson);
  border-radius: 12px;
  padding: 12px 12px 12px 14px;
  margin-bottom: 10px;
}
.hand.seen { border-left-color: var(--line); }
.hand-name { flex: 1; font-weight: 600; }
.hand-level { display: block; font-weight: 400; font-size: 13px; color: var(--slate); }
.hand button {
  min-height: 40px;
  padding: 0 14px;
  border-radius: 10px;
  font: 600 14px var(--ui);
  cursor: pointer;
  border: 1.5px solid var(--crimson);
}
.hand .show { background: var(--crimson); color: #fff; }
.hand .copy { background: #fff; color: var(--crimson); }

.used {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 18px; padding-top: 12px;
  border-top: 1px solid var(--line);
  color: var(--slate); font-size: 13px;
}

/* Full-screen reveal: the three-voice stack */
.reveal {
  position: fixed; inset: 0;
  background: var(--cream);
  overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  z-index: 10;
}
.reveal > * { max-width: 520px; margin-left: auto; margin-right: auto; }
.reveal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
#reveal-name { font: 700 22px/1.2 var(--head); color: var(--crimson); }
.reveal-level { font: 600 13px var(--ui); color: var(--slate); }
.words { list-style: none; padding: 0; margin: 0 auto 16px; }
.words li {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 14px;
  align-items: center;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 8px;
}
.words li.chars-only { display: block; padding: 12px 16px; }
.words li.chars-only .zh { font-size: 34px; }
.zh { grid-row: span 2; font: 500 30px/1.15 var(--zh); color: var(--ink); }
.py { font: 400 18.6px/1.25 var(--ui); color: var(--slate); }   /* about 62% of the Hanzi */
.en { font: italic 15px/1.25 var(--gloss); color: var(--slate); }

.words li.copy-li { display: block; }
.copy-help { margin: 0 0 8px; font-size: 14px; color: var(--slate); }
.copy-box {
  width: 100%;
  font: 17px/1.5 "Inter", "Noto Sans SC", sans-serif;   /* Inter first: cleaner tone marks */
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: var(--cream);
  resize: none;
}

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: #fff;
  padding: 10px 16px; border-radius: 999px;
  font-size: 14px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 20;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

[hidden] { display: none !important; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">Chinese Corner</div>
  <h1>Taboo</h1>
</header>

<main>
  <!-- Setup -->
  <section id="setup" class="screen">
    <div class="card">
      <label class="field-label" for="players">Players</label>
      <div class="stepper" data-for="players">
        <button type="button" class="step" data-step="-1" aria-label="Fewer players">−</button>
        <output id="players">3</output>
        <button type="button" class="step" data-step="1" aria-label="More players">+</button>
      </div>
    </div>

    <div class="card">
      <span class="field-label">Words for each player</span>
      <div class="chips" id="per-chips"></div>
      <div class="stepper small" data-for="per">
        <button type="button" class="step" data-step="-1" aria-label="Fewer words">−</button>
        <output id="per">6</output>
        <button type="button" class="step" data-step="1" aria-label="More words">+</button>
      </div>
    </div>

    <div class="card">
      <span class="field-label">Level</span>
      <label class="toggle">
        <input type="checkbox" id="mixed">
        <span>Players are at different levels</span>
      </label>
      <div id="one-level" class="levels"></div>
      <div id="player-levels"></div>
    </div>

    <p id="setup-msg" class="msg" role="status"></p>
    <button type="button" id="deal" class="primary">Deal the words</button>
  </section>

  <!-- Dealt -->
  <section id="dealt" class="screen" hidden>
    <p class="hint">Tap <b>Show</b> and pass the phone, or tap <b id="send-word">Copy</b> and send it on WhatsApp.</p>
    <div id="hands"></div>
    <button type="button" id="again" class="primary">New round, new words</button>
    <button type="button" id="back" class="secondary">Change players or level</button>
  </section>

  <footer class="used">
    <span id="used-count"></span>
    <button type="button" id="reset" class="link">Start fresh</button>
  </footer>
</main>

<!-- One player's words, full screen -->
<div id="reveal" class="reveal" hidden role="dialog" aria-modal="true" aria-labelledby="reveal-name">
  <div class="reveal-head">
    <div id="reveal-name"></div>
    <div id="reveal-level" class="reveal-level"></div>
  </div>
  <ol id="reveal-words" class="words"></ol>
  <button type="button" id="hide" class="primary">Done, hide my words</button>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>// Chinese Corner: Taboo dealer.
// The words come from window.CC_DATA, which app/build.py fills from content/banks/taboo-words.md.
// No word lives in this file.
(function () {
  "use strict";

  const POOL = window.CC_DATA.taboo;          // { "1": [{hz, py, en}], ... }
  const LEVELS = ["1", "2", "3", "4"];
  const PER_CHOICES = [3, 6, 9, 12];
  const LIMITS = { players: [1, 12], per: [1, 20] };
  const STORE = "cc-taboo-v1";

  // ---------- state ----------
  const saved = load();
  const state = {
    players: saved.players || 3,
    per: saved.per || 6,
    mixed: !!saved.mixed,
    level: saved.level || "1",
    playerLevels: saved.playerLevels || [],
    names: saved.names || [],
    used: saved.used || { 1: [], 2: [], 3: [], 4: [] },   // words dealt this session
    hands: saved.hands || null,                           // the current deal
  };

  function load() {
    try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* private mode: fine */ }
  }

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const k in attrs || {}) {
      if (k === "class") n.className = attrs[k];
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    }
    for (const kid of kids) n.append(kid);
    return n;
  };
  const levelOf = (i) => (state.mixed ? state.playerLevels[i] || state.level : state.level);
  const nameOf = (i) => (state.names[i] || "").trim() || `Player ${i + 1}`;
  const unused = (lv) => {
    const u = new Set(state.used[lv]);
    return POOL[lv].filter((w) => !u.has(w.hz));
  };

  function shuffle(arr) {
    const a = arr.slice();
    const r = new Uint32Array(a.length);
    crypto.getRandomValues(r);
    for (let i = a.length - 1; i > 0; i--) {
      const j = r[i] % (i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // How many words each level needs, and whether there are enough.
  function shortfalls() {
    const need = {};
    for (let i = 0; i < state.players; i++) need[levelOf(i)] = (need[levelOf(i)] || 0) + state.per;
    const out = [];
    for (const lv in need) {
      const left = unused(lv).length, total = POOL[lv].length;
      if (need[lv] > left) out.push({ lv, need: need[lv], left, total });
    }
    return out;
  }

  // ---------- setup screen ----------
  function renderSetup() {
    $("players").textContent = state.players;
    $("per").textContent = state.per;
    for (const s of document.querySelectorAll(".stepper")) {
      const key = s.dataset.for, [lo, hi] = LIMITS[key];
      s.querySelector('[data-step="-1"]').disabled = state[key] <= lo;
      s.querySelector('[data-step="1"]').disabled = state[key] >= hi;
    }

    const chips = $("per-chips");
    chips.replaceChildren(...PER_CHOICES.map((n) =>
      el("button", { type: "button", class: "chip", "aria-pressed": String(state.per === n),
        onclick: () => { state.per = n; changed(); } }, String(n))));

    $("mixed").checked = state.mixed;
    $("one-level").hidden = state.mixed;
    $("one-level").replaceChildren(...levelChips(state.level, (lv) => { state.level = lv; changed(); }));

    const rows = $("player-levels");
    rows.hidden = !state.mixed;
    if (state.mixed) {
      const keep = document.activeElement && document.activeElement.dataset.player;
      rows.replaceChildren(...Array.from({ length: state.players }, (_, i) => {
        const input = el("input", { type: "text", placeholder: `Player ${i + 1}`, "aria-label": `Name of player ${i + 1}`,
          "data-player": String(i), maxlength: "20" });
        input.value = state.names[i] || "";
        input.addEventListener("input", () => { state.names[i] = input.value; save(); });
        return el("div", { class: "player-row" }, input,
          el("div", { class: "levels" }, ...levelChips(levelOf(i), (lv) => { state.playerLevels[i] = lv; changed(); })));
      }));
      if (keep) { const again = rows.querySelector(`[data-player="${keep}"]`); if (again) again.focus(); }
    }

    const short = shortfalls(), msg = $("setup-msg");
    if (short.length) {
      msg.className = "msg";
      msg.textContent = short.map((s) => s.need > s.total
        ? `HSK ${s.lv} has only ${s.total} words. You asked for ${s.need}. Choose fewer players or fewer words.`
        : `HSK ${s.lv} has ${s.left} ${s.left === 1 ? "word" : "words"} left this session. You asked for ${s.need}. Choose fewer words, or tap Start fresh.`).join(" ");
    } else {
      msg.className = "msg ok";
      msg.textContent = `${state.players} × ${state.per} = ${state.players * state.per} words. No one gets the same word.`;
    }
    $("deal").disabled = short.length > 0;
  }

  function levelChips(current, pick) {
    return LEVELS.map((lv) => {
      const left = unused(lv).length;
      return el("button", { type: "button", class: "chip", "aria-pressed": String(current === lv), onclick: () => pick(lv) },
        `HSK ${lv}`, el("span", { class: "left" }, `${left} left`));
    });
  }

  function changed() {
    if (state.mixed) {
      for (let i = 0; i < state.players; i++) state.playerLevels[i] = state.playerLevels[i] || state.level;
    }
    save();
    renderSetup();
    renderUsed();
  }

  // ---------- deal ----------
  function deal() {
    if (shortfalls().length) return renderSetup();
    const decks = {};
    const hands = [];
    for (let i = 0; i < state.players; i++) {
      const lv = levelOf(i);
      decks[lv] = decks[lv] || shuffle(unused(lv));
      const words = decks[lv].splice(0, state.per);
      state.used[lv].push(...words.map((w) => w.hz));
      hands.push({ name: nameOf(i), level: lv, words, seen: false });
    }
    state.hands = hands;
    save();
    showDealt();
  }

  function showDealt() {
    $("setup").hidden = true;
    $("dealt").hidden = false;
    renderHands();
    renderUsed();
    window.scrollTo(0, 0);
  }

  function renderHands() {
    $("hands").replaceChildren(...state.hands.map((h, i) =>
      el("div", { class: "hand" + (h.seen ? " seen" : "") },
        el("div", { class: "hand-name" }, h.name, el("span", { class: "hand-level" }, `HSK ${h.level} · ${h.words.length} words`)),
        el("button", { type: "button", class: "show", onclick: () => reveal(i) }, "Show"),
        el("button", { type: "button", class: "copy", onclick: () => copy(i) }, CAN_SHARE ? "Send" : "Copy"))));
    $("send-word").textContent = CAN_SHARE ? "Send" : "Copy";
  }

  function reveal(i) {
    const h = state.hands[i];
    $("reveal-name").textContent = h.name;
    $("reveal-level").textContent = `HSK ${h.level}`;
    $("reveal-words").replaceChildren(...h.words.map((w) =>
      charsOnly(h.level)
        ? el("li", { class: "chars-only" }, el("div", { class: "zh", lang: "zh-CN" }, w.hz))
        : el("li", {}, el("div", { class: "zh", lang: "zh-CN" }, w.hz), el("div", { class: "py" }, w.py), el("div", { class: "en" }, w.en))));
    $("reveal").hidden = false;
    $("hide").focus({ preventScroll: true });
    $("reveal").scrollTop = 0;
    h.seen = true;
    save();
  }

  function hide() {
    $("reveal").hidden = true;
    renderHands();
  }

  // HSK 3 and 4 players see characters only: no pinyin, no English. Her decision, 5 Nov 2026.
  function charsOnly(level) { return Number(level) >= 3; }

  function textFor(h) {
    const line = (w, k) => charsOnly(h.level) ? `${k + 1}. ${w.hz}` : `${k + 1}. ${w.hz} ${w.py} – ${w.en}`;
    return [`Taboo · ${h.name} · HSK ${h.level}`, "", ...h.words.map(line)].join("\n");
  }

  // On phones the share sheet goes straight to WhatsApp. Elsewhere, copy to the clipboard.
  // If neither works, show the text so it can be copied by hand. Never a dead end.
  const CAN_SHARE = !!navigator.share && matchMedia("(pointer: coarse)").matches;

  async function copy(i) {
    const h = state.hands[i], text = textFor(h);
    h.seen = true;
    save();
    renderHands();
    if (CAN_SHARE) {
      try { await navigator.share({ text }); return; }
      catch (e) { if (e.name === "AbortError") return; }   // they closed the sheet: fine
    }
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      const t = el("textarea", { style: "position:fixed;opacity:0" });
      t.value = text; document.body.append(t); t.select();
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      t.remove();
    }
    if (ok) toast(`${h.name}'s words copied. Paste them in WhatsApp.`);
    else showText(h, text);
  }

  function showText(h, text) {
    $("reveal-name").textContent = h.name;
    $("reveal-level").textContent = "Copy this";
    const box = el("textarea", { class: "copy-box", readonly: "", rows: String(h.words.length + 3), "aria-label": "Words to copy" });
    box.value = text;
    $("reveal-words").replaceChildren(el("li", { class: "copy-li" },
      el("p", { class: "copy-help" }, "Press and hold the text, choose Select all, then Copy."), box));
    $("reveal").hidden = false;
    box.focus({ preventScroll: true });
    box.select();
  }

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
  }

  // ---------- session ----------
  function renderUsed() {
    const n = LEVELS.reduce((s, lv) => s + state.used[lv].length, 0);
    $("used-count").textContent = n ? `${n} words used this session` : "No words used yet";
    $("reset").hidden = n === 0;
  }

  function reset() {
    if (!confirm("Start fresh? All words become available again.")) return;
    state.used = { 1: [], 2: [], 3: [], 4: [] };
    state.hands = null;
    save();
    $("dealt").hidden = true;
    $("setup").hidden = false;
    renderSetup();
    renderUsed();
  }

  // ---------- wiring ----------
  for (const s of document.querySelectorAll(".stepper")) {
    s.addEventListener("click", (e) => {
      const b = e.target.closest(".step");
      if (!b) return;
      const key = s.dataset.for, [lo, hi] = LIMITS[key];
      state[key] = Math.min(hi, Math.max(lo, state[key] + Number(b.dataset.step)));
      changed();
    });
  }
  $("mixed").addEventListener("change", (e) => { state.mixed = e.target.checked; changed(); });
  $("deal").addEventListener("click", deal);
  $("again").addEventListener("click", () => {
    if (shortfalls().length) { $("dealt").hidden = true; $("setup").hidden = false; renderSetup(); return; }
    deal();
    toast("New words dealt.");
  });
  $("back").addEventListener("click", () => { $("dealt").hidden = true; $("setup").hidden = false; renderSetup(); });
  $("hide").addEventListener("click", hide);
  $("reset").addEventListener("click", reset);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("reveal").hidden) hide(); });

  changed();
  if (state.hands) showDealt();
})();
</script>
</body>
</html>
